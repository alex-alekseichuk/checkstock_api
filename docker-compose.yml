services:
  db:
    image: postgres:18-alpine
    container_name: checkstock_db
    environment:
      POSTGRES_DB: checkstock
      POSTGRES_USER: checkstock
      POSTGRES_PASSWORD: checkstock
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U checkstock"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./checkstock_api
    container_name: checkstock_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://checkstock:checkstock@db:5432/checkstock
    ports:
      - "8000:8000"

volumes:
  db_data:
